name: PR Checks

# Dispara en:
#  - PRs contra main
#  - push a main (para chequear regresiones)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos: solo lectura por defecto. Se eleva a 'write' para comentar el PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # Job 1: Unit Tests (espejo del stage "Unit Tests" de Jenkins)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY:                test-secret-key
      AUTH_USERNAME:             admin
      AUTH_PASSWORD:             admin
      MONGODB_URI:               ''
      AIRBNB_CALENDAR_URL:       ''
      BOOKING_CALENDAR_URL:      ''
      MERCADOPAGO_ACCESS_TOKEN:  ''
      MERCADOPAGO_WEBHOOK_SECRET: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry --version

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project false
          poetry install --with dev --no-interaction --no-ansi

      - name: Run unit tests
        run: |
          poetry run pytest \
            --junitxml=junit-report.xml \
            -v

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-report
          path: junit-report.xml
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # Job 2: Coverage (espejo del stage "Coverage" de Jenkins)
  # ============================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      SECRET_KEY:                test-secret-key
      AUTH_USERNAME:             admin
      AUTH_PASSWORD:             admin
      MONGODB_URI:               ''
      AIRBNB_CALENDAR_URL:       ''
      BOOKING_CALENDAR_URL:      ''
      MERCADOPAGO_ACCESS_TOKEN:  ''
      MERCADOPAGO_WEBHOOK_SECRET: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry --version

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project false
          poetry install --with dev --no-interaction --no-ansi

      - name: Run tests with coverage
        run: |
          poetry run pytest \
            --cov=airbnb_agent \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit-report.xml \
            -v

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE_PCT=$(poetry run coverage report --format=total | tail -n1)
          echo "coverage=${COVERAGE_PCT}" >> "$GITHUB_OUTPUT"
          echo "Total coverage: ${COVERAGE_PCT}%"

      - name: Check coverage threshold
        run: |
          COVERAGE_PCT=$(poetry run coverage report --format=total | tail -n1)
          THRESHOLD=25
          if (( $(echo "$COVERAGE_PCT < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE_PCT}% < ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE_PCT}% >= ${THRESHOLD}%"

      - name: Upload coverage XML for GitHub coverage reporting
        # GitHub detecta automáticamente coverage.xml/cobertura.xml subidos como
        # artifact con nombre que comienza con "coverage" y muestra el reporte
        # nativo en el Summary del job y en la pestaña "Files changed" del PR.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/**
            junit-report.xml
            coverage.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage to Codecov (opcional, requiere token)
        if: env.CODECOV_TOKEN != null
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          message: |
            ## 📊 Test Coverage

            | Metric | Value |
            |--------|-------|
            | **Total coverage** | **${{ steps.coverage.outputs.coverage }}%** |
            | Threshold | 25% |

            📄 Full HTML report: see `coverage-report` artifact on this run.

  # ============================================================
  # Job 3: Release (auto-tag al mergear a main)
  # ============================================================
  release:
    name: Release Tag
    runs-on: ubuntu-latest
    # Solo se dispara en push directo a main (= merge de PR cerrado),
    # NO en el push del propio PR ni en pull_request events.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage

    permissions:
      contents: write   # necesario para crear tags

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # necesitamos git history para chequear tags previos

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ No se pudo extraer la versión de pyproject.toml"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📦 Versión detectada: ${VERSION} → tag candidato: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Tag ${TAG} ya existe, saltando creación."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${TAG} no existe, se creará."
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (auto-generated from pyproject.toml)"
          git push origin "$TAG"
          echo "✅ Tag ${TAG} creado y pusheado."

      - name: Tag summary
        if: always()
        run: |
          echo "## 🚀 Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión en pyproject.toml: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            echo "- Estado: ⏭️  ya existía (no se recreó)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Estado: ✅ creado y pusheado" >> "$GITHUB_STEP_SUMMARY"
          fi